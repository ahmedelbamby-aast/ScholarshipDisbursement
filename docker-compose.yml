# Docker Compose topology for ScholarshipDisbursement.
# 
# Responsibilities:
# - Boots postgres/backend/frontend in all profiles.
# - Boots local chain + deployer only in `hardhat` profile.
# - Shares deployed contract metadata/address through `runtime_data` volume.
# 
# Operational behavior:
# - backend waits for postgres health before startup.
# - frontend waits for backend health.
# - deployer waits for chain health and writes runtime artifacts consumed by backend.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scholarship}
      POSTGRES_USER: ${POSTGRES_USER:-scholarship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholarship}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scholarship} -d ${POSTGRES_DB:-scholarship}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  chain:
    profiles: ["hardhat"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: chain/Dockerfile
    ports:
      - "8545:8545"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'eth_blockNumber',params:[],id:1})}).then(r=>r.json()).then(j=>process.exit(j.result?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  deployer:
    profiles: ["hardhat"]
    build:
      context: .
      dockerfile: deployer/Dockerfile
    env_file:
      - .env
    environment:
      NETWORK_PROFILE: ${NETWORK_PROFILE:-hardhat}
      CHAIN_RPC_URL: ${DOCKER_RPC_URL:-http://chain:8545}
      RPC_URL: ${DOCKER_RPC_URL:-http://chain:8545}
      CHAIN_ID: ${CHAIN_ID:-31337}
      HARDHAT_RPC_URL: ${DOCKER_RPC_URL:-http://chain:8545}
      HARDHAT_CHAIN_ID: ${HARDHAT_CHAIN_ID:-31337}
      HARDHAT_CONTRACT_ADDRESS: ${HARDHAT_CONTRACT_ADDRESS:-}
      HARDHAT_ADMIN_PRIVATE_KEY: ${HARDHAT_ADMIN_PRIVATE_KEY:-}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-}
      SEPOLIA_CHAIN_ID: ${SEPOLIA_CHAIN_ID:-11155111}
      SEPOLIA_CONTRACT_ADDRESS: ${SEPOLIA_CONTRACT_ADDRESS:-}
      SEPOLIA_ADMIN_PRIVATE_KEY: ${SEPOLIA_ADMIN_PRIVATE_KEY:-}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      CONTRACT_ADDRESS_FILE: /runtime/contract-address
      CONTRACT_METADATA_FILE: /runtime/contract-metadata.json
      ADMIN_PRIVATE_KEY: ${ADMIN_PRIVATE_KEY:-}
      TX_TIMEOUT_MS: ${TX_TIMEOUT_MS:-120000}
    volumes:
      - runtime_data:/runtime
    depends_on:
      chain:
        condition: service_healthy
    restart: "no"

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NETWORK_PROFILE: ${NETWORK_PROFILE:-hardhat}
      PORT: ${PORT:-4000}
      RPC_URL: ${DOCKER_RPC_URL:-http://chain:8545}
      CHAIN_ID: ${CHAIN_ID:-31337}
      HARDHAT_RPC_URL: ${DOCKER_RPC_URL:-http://chain:8545}
      HARDHAT_CHAIN_ID: ${HARDHAT_CHAIN_ID:-31337}
      HARDHAT_CONTRACT_ADDRESS: ${HARDHAT_CONTRACT_ADDRESS:-}
      HARDHAT_ADMIN_PRIVATE_KEY: ${HARDHAT_ADMIN_PRIVATE_KEY:-}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-}
      SEPOLIA_CHAIN_ID: ${SEPOLIA_CHAIN_ID:-11155111}
      SEPOLIA_CONTRACT_ADDRESS: ${SEPOLIA_CONTRACT_ADDRESS:-}
      SEPOLIA_ADMIN_PRIVATE_KEY: ${SEPOLIA_ADMIN_PRIVATE_KEY:-}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      CONTRACT_ADDRESS_FILE: /runtime/contract-address
      CONTRACT_METADATA_FILE: /runtime/contract-metadata.json
      ADMIN_PRIVATE_KEY: ${ADMIN_PRIVATE_KEY:-}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-scholarship}:${POSTGRES_PASSWORD:-scholarship}@postgres:5432/${POSTGRES_DB:-scholarship}}
      TX_TIMEOUT_MS: ${TX_TIMEOUT_MS:-120000}
    volumes:
      - runtime_data:/runtime
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      FRONTEND_PORT: 3300
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3300/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "3300:3300"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  runtime_data:
  pg_data:
