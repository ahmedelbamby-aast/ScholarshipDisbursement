<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="vendor/ethers.umd.min.js" type="application/javascript"></script>
</head>
<body class="bg-light page-shell">
  <main class="container py-4">
    <h1 class="h3 mb-3">Admin Register</h1>
    <form id="registerForm" data-role="admin" class="card card-body shadow-sm">
      <input id="fullName" class="form-control mb-2" placeholder="Full Name" required />
      <input id="email" class="form-control mb-2" placeholder="Email" required />
      <input id="password" type="password" class="form-control mb-2" placeholder="Password" required />
      <div class="d-flex gap-2 mb-2">
        <input id="walletAddress" class="form-control" placeholder="Admin Wallet Address (optional)" />
        <button id="generateWalletBtn" class="btn btn-outline-primary" type="button">Admin Wallet Generator</button>
      </div>
      <button class="btn btn-primary" type="submit">Register</button>
    </form>
    <div id="authAlert" class="alert d-none mt-3"></div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/auth-pages.js"></script>
</body>
</html>
