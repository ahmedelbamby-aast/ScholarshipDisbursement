<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
</head>
<body class="bg-light page-shell">
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Admin Dashboard</h1>
      <a href="index.html" class="btn btn-outline-secondary btn-sm">Back</a>
    </div>

    <div id="alertBox" class="alert d-none status-alert" role="alert" aria-live="polite"></div>

    <div class="row g-4">
      <div class="col-lg-6">
        <section class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5">Approve Scholarship</h2>
            <form id="approveForm" class="row g-3 mt-1">
              <div class="col-12">
                <label class="form-label">Student Wallet Address</label>
                <input id="studentAddress" class="form-control" required placeholder="0x..." />
              </div>
              <div class="col-12">
                <label class="form-label">Amount (Wei)</label>
                <input id="amountWei" type="number" min="1" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Installments</label>
                <input id="installments" type="number" min="1" class="form-control" value="2" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Claim Window (seconds)</label>
                <input id="claimWindowSeconds" type="number" min="1" class="form-control" value="86400" required />
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary">Approve</button>
              </div>
            </form>
          </div>
        </section>
      </div>

      <div class="col-lg-6">
        <section class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5">Release Installment</h2>
            <form id="releaseForm" class="row g-3 mt-1">
              <div class="col-12">
                <label class="form-label">Student Wallet Address</label>
                <input id="releaseStudentAddress" class="form-control" required placeholder="0x..." />
              </div>
              <div class="col-12">
                <label class="form-label">Installment Number</label>
                <input id="installmentNumber" type="number" min="1" class="form-control" required />
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-dark">Release</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
