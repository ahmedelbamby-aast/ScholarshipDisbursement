<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.ethers.io/lib/ethers-6.10.0.umd.min.js" type="application/javascript"></script>
</head>
<body class="bg-light">
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Student Dashboard</h1>
      <a href="index.html" class="btn btn-outline-secondary btn-sm">Back</a>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5">Connect Wallet</h2>
        <button id="connectBtn" class="btn btn-primary">Connect</button>
        <p id="walletInfo" class="text-secondary mt-2 mb-0">No wallet connected.</p>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5">Claim Released Installment</h2>
        <form id="claimForm" class="row g-3 mt-1">
          <div class="col-sm-6 col-md-4">
            <label class="form-label">Installment Number</label>
            <input id="claimInstallmentNumber" type="number" min="1" class="form-control" required />
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-dark">Claim</button>
          </div>
        </form>
      </div>
    </div>

    <div id="studentAlert" class="alert d-none" role="alert"></div>
  </main>

  <script>
    const CONTRACT_ADDRESS = window.CONTRACT_ADDRESS || "";
    const ABI = [
      "function claimInstallment(uint256 installmentNumber)",
      "function getScholarship(address student) view returns (tuple(bool approved,uint256 totalAmount,uint256 releasedAmount,uint256 claimedAmount,uint256 installments,uint256 releasedInstallments,uint256 claimedInstallments,uint256 claimWindowSeconds))",
    ];

    let signer;
    let contract;

    function showStudentAlert(message, success) {
      const alert = document.getElementById("studentAlert");
      alert.className = `alert ${success ? "alert-success" : "alert-danger"}`;
      alert.textContent = message;
    }

    document.getElementById("connectBtn").addEventListener("click", async () => {
      try {
        if (!window.ethereum) {
          throw new Error("MetaMask is required");
        }
        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();
        const address = await signer.getAddress();
        document.getElementById("walletInfo").textContent = `Connected: ${address}`;
        if (!CONTRACT_ADDRESS) {
          showStudentAlert("Contract address is missing. Set window.CONTRACT_ADDRESS.", false);
          return;
        }
        contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
      } catch (error) {
        showStudentAlert(error.message, false);
      }
    });

    document.getElementById("claimForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        if (!contract) {
          throw new Error("Connect wallet first");
        }
        const installmentNumber = Number(document.getElementById("claimInstallmentNumber").value);
        const tx = await contract.claimInstallment(installmentNumber);
        const receipt = await tx.wait();
        showStudentAlert(`Claim successful. Tx: ${receipt.hash}`, true);
      } catch (error) {
        showStudentAlert(error.message || "Claim failed", false);
      }
    });
  </script>
</body>
</html>
