<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script src="https://cdn.ethers.io/lib/ethers-6.10.0.umd.min.js" type="application/javascript"></script>
</head>
<body class="bg-light page-shell">
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Student Dashboard</h1>
      <a href="index.html" class="btn btn-outline-secondary btn-sm">Back</a>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5">Connect Wallet</h2>
        <button id="connectBtn" class="btn btn-primary">Connect</button>
        <p id="walletInfo" class="text-secondary mt-2 mb-0">No wallet connected.</p>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5">Claim Released Installment</h2>
        <form id="claimForm" class="row g-3 mt-1">
          <div class="col-sm-6 col-md-4">
            <label class="form-label">Installment Number</label>
            <input id="claimInstallmentNumber" type="number" min="1" class="form-control" required />
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-dark">Claim</button>
          </div>
        </form>
      </div>
    </div>

    <div id="studentAlert" class="alert d-none status-alert" role="alert" aria-live="polite"></div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/student-dashboard.js"></script>
</body>
</html>
